services:
  app:
    env_file: .env
    build: .
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app_data
  caddy:
    image: caddy:2-alpine
    network_mode: host
    environment:
      OAUTH_DOMAIN: '${OAUTH_DOMAIN}'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
  app_data: